# Optional reference for Coolify "Docker Compose" deployments.
# Prefer the root Dockerfile + Coolify UI volume/env settings (see DEPLOY.md).
services:
  utilization-dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Set these in Coolify (do not commit secrets):
      # NEXT_PUBLIC_AZURE_CLIENT_ID
      # NEXT_PUBLIC_AZURE_TENANT_ID
      # NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS
      # TIMESHEETS_API_TOKEN
      # TIMESHEETS_ORGANIZATION_ID
      # TIMESHEETS_TIMEZONE
    volumes:
      - utilization-data:/app/data
    restart: unless-stopped

volumes:
  utilization-data:
